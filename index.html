<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101114">
  <title>Banestes Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading" class="loading">Carregando…</div>

  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card" novalidate>
      <h1>Banestes Tracker</h1>
      <p class="muted">Acompanhamento da preparação para Técnico Bancário.</p>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button type="submit" class="btn primary" id="login-btn">Entrar</button>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">Banestes Tracker</div>
      <nav id="nav" aria-label="Navegação principal">
        <a href="#/dashboard" data-route="dashboard">Início</a>
        <a href="#/edital" data-route="edital">Edital</a>
        <a href="#/estudos" data-route="estudos">Estudos</a>
        <a href="#/desempenho" data-route="desempenho">Desempenho</a>
        <a href="#/revisoes" data-route="revisoes">Revisões</a>
        <a href="#/planejamento" data-route="planejamento"><span class="long">Planejamento</span><span class="short">Plano</span></a>
      </nav>
      <div class="user">
        <span id="user-email" class="muted"></span>
        <button id="logout" class="btn ghost" type="button">Sair</button>
      </div>
    </aside>
    <div class="content">
      <header class="topbar">
        <span>Banestes Tracker</span>
        <button id="logout-m" class="btn ghost" type="button">Sair</button>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
